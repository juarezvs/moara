services:
  webui:
    image: ai-webui:moara-auto-documents-20261027-r4
    build:
      context: ../moara/webui/auto-documents
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ai-webui:moara-feedback-20261027
    environment:
      RAG_EMBEDDING_BATCH_SIZE: '16'
      RAG_EMBEDDING_CONCURRENT_REQUESTS: '1'
      ENABLE_ASYNC_EMBEDDING: 'false'
