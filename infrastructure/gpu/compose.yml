name: moara-gpu
services:
  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    container_name: moara-gpu-ollama
    restart: unless-stopped
    ports: ['127.0.0.1:11434:11434']
    volumes: ['/srv/moara-inference:/root/.ollama']
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NOPRUNE: '1'
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    mem_limit: 24g
    memswap_limit: 24g
    cpus: 20
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  embeddings:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    container_name: moara-gpu-embeddings
    restart: unless-stopped
    ports: ['127.0.0.1:11435:11434']
    volumes: ['/srv/moara-inference/models:/root/.ollama/models:ro']
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_NOPRUNE: '1'
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
